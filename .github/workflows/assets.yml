name: assets

on:
  pull_request:

jobs:
  assets:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Skip when there is no frontend yet
        if: ${{ !hashFiles('package.json') }}
        run: echo "package.json absent — admin frontend not added yet"

      - uses: actions/setup-node@v4
        if: ${{ hashFiles('package.json') }}
        with:
          node-version: '22'
          cache: npm

      - name: Build admin assets
        if: ${{ hashFiles('package.json') }}
        run: |
          npm ci
          npm run typecheck
          npm run test:frontend
          npm run build

      - name: Fail when dist/ is out of date
        if: ${{ hashFiles('package.json') }}
        run: git diff --exit-code dist/
